<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0a0e17;border-radius:14px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,0.6);">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Shield & Accent Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pulseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.65"/>
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" opacity="0.2"/>
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#textGrad);
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 16px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .radar-sweep {
      transform-origin: 1040px 180px;
      animation: rotateRadar 7s linear infinite;
    }
    .pulse-ring-1 {
      animation: pulseAnim 3s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      transform-origin: 1040px 180px;
    }
    .pulse-ring-2 {
      animation: pulseAnim 3s cubic-bezier(0.215, 0.61, 0.355, 1) infinite 1.5s;
      transform-origin: 1040px 180px;
    }
    .node-pulse {
      animation: nodeBlink 2.5s ease-in-out infinite alternate;
    }
    .flow-dash {
      stroke-dasharray: 8 6;
      animation: dashMove 14s linear infinite;
    }
    @keyframes rotateRadar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulseAnim {
      0% { r: 18; opacity: 0.8; }
      100% { r: 110; opacity: 0; }
    }
    @keyframes nodeBlink {
      0% { opacity: 0.3; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1.05); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -200; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#cyberGrid)"/>

  <!-- Dynamic Cyber Mesh & Connected Wave (Background) -->
  <g opacity="0.35">
    <path class="flow-dash" d="M -50 80 Q 250 140 500 70 T 950 110 T 1250 80" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path class="flow-dash" d="M -50 280 Q 200 220 520 290 T 980 240 T 1250 290" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-dashoffset="50"/>
  </g>

  <!-- Right Side Interactive/Dynamic Radar Scanner (Behind Foreground Elements) -->
  <g id="radarGroup">
    <circle cx="1040" cy="180" r="110" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="1040" cy="180" r="80" fill="none" stroke="#334155" stroke-width="1.5"/>
    <circle cx="1040" cy="180" r="45" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.6"/>
    <circle cx="1040" cy="180" r="18" fill="#38bdf8" opacity="0.2"/>

    <!-- Pulse Waves -->
    <circle class="pulse-ring-1" cx="1040" cy="180" r="18" fill="none" stroke="#00f2fe" stroke-width="2"/>
    <circle class="pulse-ring-2" cx="1040" cy="180" r="18" fill="none" stroke="#6366f1" stroke-width="1.8"/>

    <!-- Rotating Radar Beam -->
    <g class="radar-sweep">
      <path d="M 1040 180 L 1150 180 A 110 110 0 0 0 1117 102 Z" fill="url(#shieldGrad)" opacity="0.25" filter="url(#glow)"/>
      <line x1="1040" y1="180" x2="1150" y2="180" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>
    </g>

    <!-- Radar Target Blips -->
    <circle class="node-pulse" cx="1080" cy="140" r="4" fill="#ef4444" filter="url(#glow)"/>
    <circle class="node-pulse" cx="1010" cy="230" r="4.5" fill="#22c55e" filter="url(#glow)"/>
    <circle class="node-pulse" cx="1110" cy="205" r="3.5" fill="#eab308" filter="url(#glow)"/>
  </g>

  <!-- Foreground Content: Shield Logo & Branding -->
  <g transform="translate(60, 65)">
    <!-- Security Shield Emblem -->
    <g transform="translate(0, 5)">
      <polygon points="40,5 75,20 75,60 40,90 5,60 5,20" fill="url(#cardGrad)" stroke="url(#shieldGrad)" stroke-width="3" filter="url(#glow)"/>
      <!-- Inner Shield Core -->
      <polygon points="40,16 63,28 63,54 40,75 17,54 17,28" fill="url(#shieldGrad)" opacity="0.8"/>
      <!-- Checkmark / Lock icon in shield -->
      <path d="M 30 46 L 37 53 L 52 38" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Title and Subtitle (Guaranteed Foreground Clarity) -->
    <text x="100" y="48" class="title-text">Awesome Enterprise Endpoint Protection</text>
    <text x="102" y="86" class="sub-text">Curated Guide to Next-Gen EDR, XDR, HIDS, and Autonomous Endpoint Security</text>

    <!-- Interactive Badges / Metrics Row -->
    <g transform="translate(102, 125)">
      <!-- Pill 1: EDR & XDR -->
      <g>
        <rect width="145" height="36" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2"/>
        <circle cx="20" cy="18" r="5" fill="#38bdf8" class="node-pulse"/>
        <text x="36" y="23" class="badge-text">🛡️ EDR &amp; XDR</text>
      </g>

      <!-- Pill 2: Threat Detection -->
      <g transform="translate(160, 0)">
        <rect width="180" height="36" rx="8" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.2"/>
        <circle cx="20" cy="18" r="5" fill="#6366f1" class="node-pulse"/>
        <text x="36" y="23" class="badge-text">⚡ Autonomous Response</text>
      </g>

      <!-- Pill 3: Open-Source HIDS -->
      <g transform="translate(355, 0)">
        <rect width="165" height="36" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2"/>
        <circle cx="20" cy="18" r="5" fill="#10b981" class="node-pulse"/>
        <text x="36" y="23" class="badge-text">🔓 Open-Source HIDS</text>
      </g>

      <!-- Pill 4: Zero Trust -->
      <g transform="translate(535, 0)">
        <rect width="185" height="36" rx="8" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2"/>
        <circle cx="20" cy="18" r="5" fill="#a855f7" class="node-pulse"/>
        <text x="36" y="23" class="badge-text">🌐 Zero-Trust Architecture</text>
      </g>
    </g>

    <!-- Live Telemetry Tagline -->
    <g transform="translate(102, 195)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" font-weight="500">
        ✨ Real-Time Telemetry  •  Continuous Behavioral Recording  •  Ransomware Rollback  •  MITRE ATT&amp;CK Mapped
      </text>
    </g>
  </g>
</svg>