<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360" style="background:#0a0e17;border-radius:14px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.6)"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b1120"/><stop offset="50%" stop-color="#050811"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="shieldGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#6366f1"/><stop offset="100%" stop-color="#a855f7"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".85"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".95"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="pulseGlow" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="10"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-width=".7" d="M 40 0 L 0 0 0 40" opacity=".65"/><circle cx="40" cy="40" r="1.5" fill="#38bdf8" opacity=".2"/></pattern></defs><style>@keyframes pulseAnim{0%{r:18;opacity:.8}}@keyframes nodeBlink{0%{opacity:.3;transform:scale(.95)}}.badge-text,.sub-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:42px;fill:url(#textGrad);letter-spacing:-.5px}.sub-text{font-weight:500;font-size:16px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#e2e8f0}.radar-sweep{transform-origin:1040px 180px;animation:rotateRadar 7s linear infinite}.pulse-ring-1,.pulse-ring-2{animation:pulseAnim 3s cubic-bezier(.215,.61,.355,1) infinite;transform-origin:1040px 180px}.pulse-ring-2{animation:pulseAnim 3s cubic-bezier(.215,.61,.355,1) infinite 1.5s}.node-pulse{animation:nodeBlink 2.5s ease-in-out infinite alternate}.flow-dash{stroke-dasharray:8 6;animation:dashMove 14s linear infinite}</style><rect width="1200" height="360" fill="url(#bgGrad)"/><rect width="1200" height="360" fill="url(#cyberGrid)"/><g opacity=".35"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M -50 80 Q 250 140 500 70 T 950 110 T 1250 80" class="flow-dash"/><path fill="none" stroke="#818cf8" stroke-dashoffset="50" stroke-width="1.8" d="M -50 280 Q 200 220 520 290 T 980 240 T 1250 290" class="flow-dash"/></g><g id="radarGroup"><circle cx="1040" cy="180" r="110" fill="none" stroke="#1e293b" stroke-dasharray="4 4" stroke-width="1.5"/><circle cx="1040" cy="180" r="80" fill="none" stroke="#334155" stroke-width="1.5"/><circle cx="1040" cy="180" r="45" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity=".6"/><circle cx="1040" cy="180" r="18" fill="#38bdf8" opacity=".2"/><circle cx="1040" cy="180" r="18" fill="none" stroke="#00f2fe" stroke-width="2" class="pulse-ring-1"/><circle cx="1040" cy="180" r="18" fill="none" stroke="#6366f1" stroke-width="1.8" class="pulse-ring-2"/><g class="radar-sweep"><path fill="url(#shieldGrad)" d="M 1040 180 L 1150 180 A 110 110 0 0 0 1117 102 Z" filter="url(#glow)" opacity=".25"/><line x1="1040" x2="1150" y1="180" y2="180" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/></g><circle cx="1080" cy="140" r="4" fill="#ef4444" class="node-pulse" filter="url(#glow)"/><circle cx="1010" cy="230" r="4.5" fill="#22c55e" class="node-pulse" filter="url(#glow)"/><circle cx="1110" cy="205" r="3.5" fill="#eab308" class="node-pulse" filter="url(#glow)"/></g><g><g transform="translate(60, 65) translate(0, 5)"><polygon fill="url(#cardGrad)" stroke="url(#shieldGrad)" stroke-width="3" points="40 5 75 20 75 60 40 90 5 60 5 20" filter="url(#glow)"/><polygon fill="url(#shieldGrad)" points="40 16 63 28 63 54 40 75 17 54 17 28" opacity=".8"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" d="M 30 46 L 37 53 L 52 38"/></g><text x="100" y="48" class="title-text" transform="translate(60, 65)">Awesome Enterprise Endpoint Protection</text><text x="102" y="86" class="sub-text" transform="translate(60, 65)">Curated Guide to Next-Gen EDR, XDR, HIDS, and Autonomous Endpoint Security</text><g><g transform="translate(60, 65) translate(102, 125)"><rect width="145" height="36" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" rx="8"/><circle cx="20" cy="18" r="5" fill="#38bdf8" class="node-pulse"/><text x="36" y="23" class="badge-text">🛡️ EDR &amp; XDR</text></g><g transform="translate(60, 65) translate(102, 125) translate(160, 0)"><rect width="180" height="36" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.2" rx="8"/><circle cx="20" cy="18" r="5" fill="#6366f1" class="node-pulse"/><text x="36" y="23" class="badge-text">⚡ Autonomous Response</text></g><g transform="translate(60, 65) translate(102, 125) translate(355, 0)"><rect width="165" height="36" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" rx="8"/><circle cx="20" cy="18" r="5" fill="#10b981" class="node-pulse"/><text x="36" y="23" class="badge-text">🔓 Open-Source HIDS</text></g><g transform="translate(60, 65) translate(102, 125) translate(535, 0)"><rect width="185" height="36" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" rx="8"/><circle cx="20" cy="18" r="5" fill="#a855f7" class="node-pulse"/><text x="36" y="23" class="badge-text">🌐 Zero-Trust Architecture</text></g></g><g><text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" transform="translate(60, 65) translate(102, 195)">✨ Real-Time Telemetry • Continuous Behavioral Recording • Ransomware Rollback • MITRE ATT&amp;CK Mapped</text></g></g></svg>